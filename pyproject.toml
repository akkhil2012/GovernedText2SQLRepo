[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "GovernedText2SQL"
version = "0.1.0"
description = "Governed banking analytics with SQL, semantic plans and Ontop VKGs"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4", "sqlglot>=26,<27", "rdflib>=7,<8"]
[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and Ontop"]
[tool.ruff]
line-length = 100
